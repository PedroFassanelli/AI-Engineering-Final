# The Intelligence System — despliegue local con una sola instrucción:
#
#   ./run.sh            (Linux / macOS / Git Bash)
#   .\run.ps1           (Windows PowerShell)
#   docker compose up -d --build     (lo mismo, sin los chequeos previos)
#
# API:      http://localhost:8000/docs
# Phoenix:  http://localhost:6006
#
# Para correr la API y el worker fuera de Docker (desarrollo), alcanza con:
#   docker compose up -d redis phoenix

name: nimbus-intelligence

services:
  redis:
    # Redis 8 trae incorporados los módulos de búsqueda y JSON que necesita
    # AsyncRedisSaver (langgraph-checkpoint-redis). Un Redis 7 "pelado" no alcanza.
    image: redis:8
    # AOF: los jobs, las conversaciones y los checkpoints de LangGraph
    # sobreviven a un reinicio del contenedor (y de todo el stack).
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  phoenix:
    # Versión fija: la probada. `latest` cambia solo y una máquina limpia
    # bajaría otra distinta.
    image: arizephoenix/phoenix:version-20.19.0
    ports:
      - "6006:6006"   # UI + colector OTLP/HTTP (/v1/traces)
      - "4317:4317"   # colector OTLP/gRPC
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes: [phoenix-data:/mnt/data]
    # La primera vez corre las migraciones de su base: puede tardar un minuto.
    # El worker espera a que responda; si no, los spans de las primeras
    # ejecuciones se pierden (el exportador reintenta y después los descarta).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
    ports: ["8000:8000"]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      DB_NEGOCIO: /data/nimbus.db
    volumes: [negocio-data:/data]
    depends_on:
      redis: {condition: service_healthy}
      phoenix: {condition: service_healthy}
    # Si arranca sin poder abrir el RAG (claves, red), se reintenta solo.
    restart: on-failure

volumes:
  redis-data:
  phoenix-data:
  negocio-data:
